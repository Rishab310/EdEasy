name: Keep EdEasy Awake
 
on:
  schedule:
    # Runs every 10 minutes. Render free-tier instances spin down after
    # ~15 minutes of inactivity, so this keeps it warm.
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping EdEasy
        run: |
          curl -sS -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" https://edeasy.onrender.com/ || echo "Ping failed (app may be waking up)"
